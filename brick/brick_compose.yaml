# blocks-author — production compose (the CANONICAL, single source of truth).
#
# arduino-app-cli includes this file VERBATIM into the app's generated compose
# via Docker Compose `include:` (provision.go) — no field stripping — then runs
# `docker compose up -d --remove-orphans --pull missing` (orchestrator.go). With
# `--pull missing` the published `image:` is pulled only if absent locally.
#
# For LOCAL App Lab testing we do NOT edit this file: scripts/install-local-brick.sh
# derives a dev variant from it, swapping ONLY the `image:` line to a locally
# built tag (blocks-author:dev). Everything else (ports/volume/env/healthcheck)
# stays identical, so prod and dev cannot drift.
#
# Note on `${VAR}`: the daemon resolves ${APP_HOME} and brick variables into the
# compose process environment; the `${...:-default}` fallbacks below also make
# this file runnable by plain `docker compose` with no daemon.
services:
  blocks-author:
    image: ${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/}app-bricks/blocks-author:latest
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    ports:
      # THIS container publishes the editor port (brick_config.yaml keeps
      # `ports: []` so the main service doesn't also bind 7100 — see the note
      # there). Default 0.0.0.0 so it's reachable at <board-ip>:7100 for testing;
      # override with BIND_ADDRESS=127.0.0.1 to keep it board-local.
      - "${BIND_ADDRESS:-0.0.0.0}:7100:7100"
    volumes:
      # The app root the editor reads/writes (.blk + regenerated source +
      # sketch.yaml libraries + requirements.txt + .blocks/ catalogs).
      - "${APP_HOME:-.}:/app"
    environment:
      # Forward each brick variable into THIS container (the daemon injects them
      # only into the main app service, not into brick services).
      EDITABLE_EXTENSIONS: "${EDITABLE_EXTENSIONS:-ino,cpp,py}"
      GENERATE_MODE: "${GENERATE_MODE:-auto}"
      DEFAULT_FQBN: "${DEFAULT_FQBN:-arduino:zephyr:unoq}"
      SHOW_MINIMAP: "${SHOW_MINIMAP:-false}"
      LOCALE: "${LOCALE:-}"
      CATALOG_REGISTRY_URL: "${CATALOG_REGISTRY_URL:-}"
    healthcheck:
      # /health returns 200 only when serving AND catalogs are loaded (G11),
      # matching App Lab's openUIWhenReady poll. node is always present in the
      # runtime image (curl is not).
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:7100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 20
