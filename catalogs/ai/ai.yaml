id: brick-ai
category: "Language"

implementations:
  - runtime: "arduino:python"
    dependencies:
      - type: brick
        name: "arduino:cloud_llm"
      - type: brick
        name: "arduino:llm"
      - type: brick
        name: "arduino:vlm"
    codegen:
      imports:
        - "from arduino.app_utils import CloudLLM, LargeLanguageModel, VisionLanguageModel"
    blocks:
      - blockly:
          type: ai_cloud_llm_stream
          message0: "ask cloud LLM %1"
          args0:
            - type: input_value
              name: PROMPT
              check: String
          message1: "model %1  memory %2"
          args1:
            - type: field_dropdown
              name: MODEL
              options:
                - ["GPT-4o", "gpt-4o"]
                - ["GPT-4o mini", "gpt-4o-mini"]
                - ["Claude Sonnet", "claude-sonnet-4-6"]
                - ["Gemini Flash", "gemini-2.0-flash"]
            - type: field_checkbox
              name: MEMORY
              checked: true
          message2: "system prompt %1"
          args2:
            - type: field_multilinetext
              name: SYSTEM_PROMPT
              text: "You are a helpful assistant."
          message3: "for each response %1 do"
          args3:
            - type: field_variable
              name: RESULT_VAR
              variable: response
          message4: "%1"
          args4:
            - type: input_statement
              name: DO
          nextStatement: null
          extensions:
            - hat_event_style
          tooltip: "Ask a cloud LLM a question. For each streamed response chunk, run the blocks."
        codegen:
          declarations:
            - "_cloud_llm = CloudLLM(model='{{MODEL}}', system_prompt='{{SYSTEM_PROMPT}}', memory={{MEMORY}})"
            - "def _on_cloud_llm_response({{RESULT_VAR}}):\n  {{DO}}"
          setup:
            - "_cloud_llm.chat_stream_callback = _on_cloud_llm_response"
        tags: [ai, llm, cloud, advanced]

      - blockly:
          type: ai_edge_llm_stream
          message0: "ask edge LLM %1"
          args0:
            - type: input_value
              name: PROMPT
              check: String
          message1: "memory %1"
          args1:
            - type: field_checkbox
              name: MEMORY
              checked: true
          message2: "system prompt %1"
          args2:
            - type: field_multilinetext
              name: SYSTEM_PROMPT
              text: "You are a helpful assistant."
          message3: "for each response %1 do"
          args3:
            - type: field_variable
              name: RESULT_VAR
              variable: response
          message4: "%1"
          args4:
            - type: input_statement
              name: DO
          nextStatement: null
          extensions:
            - hat_event_style
          tooltip: "Ask the on-device edge LLM a question. For each streamed response chunk, run the blocks."
        codegen:
          declarations:
            - "_edge_llm = LargeLanguageModel(system_prompt='{{SYSTEM_PROMPT}}', memory={{MEMORY}})"
          setup:
            - "for {{RESULT_VAR}} in _edge_llm.chat_stream({{PROMPT}}):\n  {{DO}}"
        tags: [ai, llm, edge, advanced]

      - blockly:
          type: ai_vlm_ask
          message0: "ask VLM %1 about image %2"
          args0:
            - type: input_value
              name: PROMPT
              check: String
            - type: input_value
              name: IMAGE
          output: null
          tooltip: "Ask a vision-language model a question about an image. Returns the response text."
          inputsInline: true
        codegen:
          body:
            - "VisionLanguageModel().chat(message={{PROMPT}}, images=[{{IMAGE}}])"
          precedence: ATOMIC
          inputDefaults:
            PROMPT: '""'
            IMAGE: "None"
        tags: [ai, vlm, vision, advanced]

      - blockly:
          type: ai_clear_memory
          message0: "clear AI memory"
          previousStatement: null
          nextStatement: null
          tooltip: "Clear the conversation history from the LLM so the next question starts fresh."
          inputsInline: true
        codegen:
          body:
            - "_edge_llm.clear_memory()"
        tags: [ai, llm, utility]

      - blockly:
          type: ai_stop_stream
          message0: "stop AI response"
          previousStatement: null
          nextStatement: null
          tooltip: "Interrupt a running LLM stream response."
          inputsInline: true
        codegen:
          body:
            - "_edge_llm.stop_stream()"
        tags: [ai, llm, utility]
