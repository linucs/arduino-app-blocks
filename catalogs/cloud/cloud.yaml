id: brick-arduino-cloud
category: "IoT"

implementations:
  - runtime: "arduino:python"
    dependencies:
      - type: brick
        name: "arduino:arduino_cloud"
    codegen:
      imports:
        - "from arduino.app_utils import ArduinoCloud"
      declarations:
        - "_arduino_cloud = ArduinoCloud()"
    blocks:
      - blockly:
          type: cloud_on_variable_change
          message0: "when cloud variable %1 changes"
          args0:
            - type: field_input
              name: NAME
              text: "temperature"
          message1: "new value in %1"
          args1:
            - type: field_variable
              name: VALUE_VAR
              variable: value
          message2: "initial value %1"
          args2:
            - type: input_value
              name: INITIAL
          message3: "do %1"
          args3:
            - type: input_statement
              name: DO
          nextStatement: null
          extensions:
            - hat_event_style
          tooltip: "Run blocks whenever the specified Arduino IoT Cloud variable changes."
        codegen:
          declarations:
            - "def _on_cloud_var_{{NAME}}({{VALUE_VAR}}):\n  {{DO}}"
          setup:
            - "_arduino_cloud.register('{{NAME}}', value={{INITIAL}}, on_write=_on_cloud_var_{{NAME}})"
        tags: [event, cloud, iot, beginner]
