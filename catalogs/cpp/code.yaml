# yaml-language-server: $schema=https://raw.githubusercontent.com/linucs/arduino-app-blocks/refs/heads/main/src/catalog/block-catalog_v1.schema.json
# Brick-authored. The C++ "Code" family, structured identically to the Python
# side (catalogs/arduino/python/code.yaml) — only the runtime + raw-code language
# differ. Replaces the imperative defs previously in cppLanguageBlocks.ts and the
# code_setup entry in core.yaml, so all code_* blocks live in one place and route
# through the single routeToZone() factory (webview/codegen/sectionGenerators.ts).
#   code_statement / code_expression — raw code leaves (declarative codegen)
#   code_includes / code_declaration / code_setup — section containers that route
#     their nested blocks to the #include / global / setup() zones.
# Colours come from ThemeAdapter (the Code category default) — no hex here.
id: arduino_code
category: Code
implementations:
  - runtime: arduino:cpp
    blocks:
      - blockly:
          type: code_statement
          message0: "⟨ %1 ⟩"
          args0:
            - type: field_code
              name: CODE
              text: ""
          previousStatement: null
          nextStatement: null
          tooltip: "Insert raw C++ statement(s) verbatim. Place inside a section container to target the #include / global / setup zone."
        codegen:
          body:
            - "{{CODE}}"

      - blockly:
          type: code_expression
          message0: "⟨ %1 ⟩"
          args0:
            - type: field_input
              name: CODE
              text: expression
          output: null
          tooltip: "Raw C++ expression inserted as-is as a value."
        codegen:
          body:
            - "{{CODE}}"
          precedence: ATOMIC

      - blockly:
          type: code_includes
          message0: "includes %1"
          args0:
            - type: input_statement
              name: MEMBERS
          tooltip: "C++: blocks inside go to the #include zone at the top of the file. Put '#include <...>' lines here using a custom code block."
        generator: code_includes

      - blockly:
          type: code_declaration
          message0: "globals %1"
          args0:
            - type: input_statement
              name: MEMBERS
          tooltip: "C++: blocks inside go to global scope (after includes, before setup) — e.g. global variables or helper definitions."
        generator: code_declaration

      - blockly:
          type: code_setup
          message0: "setup %1"
          args0:
            - type: input_statement
              name: MEMBERS
          tooltip: "C++: blocks inside run once at startup, in setup(). Use for begin()/init calls and pinMode()."
        generator: code_setup
