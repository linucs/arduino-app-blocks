# yaml-language-server: $schema=https://raw.githubusercontent.com/linucs/arduino-app-blocks/refs/heads/main/src/catalog/block-catalog_v1.schema.json
# Brick-authored (ported from arduino-app-lab): the MCU-side onboard RGB LED,
# mirroring the Python python_led block (CPU-side LEDs 1/2). On the UNO Q the
# MCU drives LEDs 3/4 (active-LOW), the SBC drives LEDs 1/2 — so each language
# controls its own RGB LED with a parallel "set LED" block.
id: arduino_onboard_led
category: Control
implementations:
  - runtime: arduino:cpp
    blocks:
      - blockly:
          type: cpp_led
          message0: "set LED %1  R %2  G %3  B %4"
          args0:
            - type: field_dropdown
              name: LED
              options:
                - ["3", "3"]
                - ["4", "4"]
            - type: field_dropdown
              name: R
              options:
                - ["ON", "LOW"]
                - ["OFF", "HIGH"]
            - type: field_dropdown
              name: G
              options:
                - ["ON", "LOW"]
                - ["OFF", "HIGH"]
            - type: field_dropdown
              name: B
              options:
                - ["ON", "LOW"]
                - ["OFF", "HIGH"]
          previousStatement: null
          nextStatement: null
          tooltip: "Set the R / G / B channels of an MCU-side onboard RGB LED (3 or 4). Active-LOW: ON drives the pin low."
        codegen:
          setup:
            - "pinMode(LED{{LED}}_R, OUTPUT);"
            - "pinMode(LED{{LED}}_G, OUTPUT);"
            - "pinMode(LED{{LED}}_B, OUTPUT);"
            - "digitalWrite(LED{{LED}}_R, HIGH);"
            - "digitalWrite(LED{{LED}}_G, HIGH);"
            - "digitalWrite(LED{{LED}}_B, HIGH);"
          body:
            - "digitalWrite(LED{{LED}}_R, {{R}});"
            - "digitalWrite(LED{{LED}}_G, {{G}});"
            - "digitalWrite(LED{{LED}}_B, {{B}});"
