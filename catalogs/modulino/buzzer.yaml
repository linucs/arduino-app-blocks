id: modulino-buzzer
category: "Sensors"
docs:
  datasheet: "https://docs.arduino.cc/hardware/modulino-buzzer"
  library: "https://www.arduino.cc/reference/en/libraries/modulino/"
  api: "https://github.com/arduino-libraries/Modulino/blob/main/docs/api.md"

implementations:
  # ─── C++ (MCU side) ───
  - runtime: "arduino:cpp"
    dependencies:
      - type: library
        name: "Modulino"
        minVersion: "0.5.0"
    codegen:
      imports:
        - "#include <Modulino.h>"
        - "#include <Wire.h>"
      declarations:
        - "ModulinoBuzzer _buzzer;"
      setup:
        - "Wire1.begin();"
        - "Modulino.begin(Wire1);"
        - "_buzzer.begin();"
    blocks:
      - blockly:
          type: modulino_buzzer_tone
          message0: "🔔 buzzer tone %1 Hz for %2 ms"
          args0:
            - type: input_value
              name: FREQ
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte",
                      "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
            - type: input_value
              name: DURATION
              check: ["Number", "int", "unsigned int", "long", "unsigned long", "byte",
                      "word", "uint8_t", "uint16_t", "uint32_t", "int8_t", "int16_t", "int32_t"]
          previousStatement: null
          nextStatement: null
          tooltip: "Play a tone at the specified frequency (Hz) for a duration (ms) on Modulino Buzzer."
          inputsInline: true
        codegen:
          body:
            - "_buzzer.tone({{FREQ}}, {{DURATION}});"
          inputDefaults:
            FREQ: 440
            DURATION: 200
        tags: [actuator, audio, i2c, beginner]

      - blockly:
          type: modulino_buzzer_stop
          message0: "🔔 buzzer stop"
          previousStatement: null
          nextStatement: null
          tooltip: "Stop any playing tone on Modulino Buzzer."
          inputsInline: true
        codegen:
          body:
            - "_buzzer.noTone();"
        tags: [actuator, audio, i2c]

  # ─── Python (SBC side) ───
  - runtime: "arduino:python"
    dependencies:
      - type: pip
        name: "modulino"
        minVersion: "0.5.0"
    codegen:
      imports:
        - "from modulino import ModulinoBuzzer"
      declarations:
        - "_buzzer = ModulinoBuzzer()"
    blocks:
      - blockly:
          type: modulino_buzzer_tone
          message0: "🔔 buzzer tone %1 Hz for %2 ms"
          args0:
            - type: input_value
              name: FREQ
            - type: input_value
              name: DURATION
          previousStatement: null
          nextStatement: null
          tooltip: "Play a tone at the specified frequency (Hz) for a duration (ms) on Modulino Buzzer."
          inputsInline: true
        codegen:
          body:
            - "_buzzer.tone({{FREQ}}, {{DURATION}})"
          inputDefaults:
            FREQ: 440
            DURATION: 200
        tags: [actuator, audio, i2c, beginner]

      - blockly:
          type: modulino_buzzer_stop
          message0: "🔔 buzzer stop"
          previousStatement: null
          nextStatement: null
          tooltip: "Stop any playing tone on Modulino Buzzer."
          inputsInline: true
        codegen:
          body:
            - "_buzzer.no_tone()"
        tags: [actuator, audio, i2c]
