# yaml-language-server: $schema=https://raw.githubusercontent.com/linucs/arduino-app-blocks/refs/heads/main/src/catalog/block-catalog_v1.schema.json
id: builtin_communication
category: Messaging
docs:
  library: https://docs.arduino.cc/libraries/bridge/
  api: https://docs.arduino.cc/software/app-lab/bridge/bridge-api/
implementations:
- runtime: arduino:python
  codegen:
    imports:
    - from arduino.app_utils import Bridge
  blocks:
  - blockly:
      type: python_bridge_notify
      message0: notify %1 of %2 through bridge
      args0:
      - type: field_input
        name: NAME
        text: eventName
      - type: input_value
        name: ARGS
      previousStatement: null
      nextStatement: null
      tooltip: Send a notification event to the MCU side via the Bridge.
      helpUrl: https://docs.arduino.cc/software/app-lab/bridge/bridge-api/
      inputsInline: true
    codegen:
      body:
      - Bridge.notify("{{NAME}}", {{ARGS}})
      inputDefaults:
        ARGS: None
  - blockly:
      type: python_bridge_provide
      message0: listen to bridge for %1 data %2
      args0:
      - type: field_input
        name: NAME
        text: serviceName
      - type: field_param_input
        name: PARAM_NAME
        text: args
      message1: do %1
      args1:
      - type: input_statement
        name: BODY
      nextStatement: null
      extensions:
      - hat_event_style
      tooltip: Register a handler for a Bridge service call from the MCU side.
      helpUrl: https://docs.arduino.cc/software/app-lab/bridge/bridge-api/
    codegen:
      declarations:
      - 'def _bridge_handler_{{NAME}}({{PARAM_NAME}}):

        {{BODY}}'
      setup:
      - Bridge.provide("{{NAME}}", _bridge_handler_{{NAME}})
  - blockly:
      type: python_bridge_call
      message0: call %1 through bridge with data %2
      args0:
      - type: field_input
        name: NAME
        text: serviceName
      - type: input_value
        name: ARGS
      output: null
      tooltip: Call a Bridge service on the MCU and return the result.
      helpUrl: https://docs.arduino.cc/software/app-lab/bridge/bridge-api/
      inputsInline: true
    codegen:
      body:
      - Bridge.call("{{NAME}}", {{ARGS}})
      precedence: ATOMIC
      inputDefaults:
        ARGS: None
  - blockly:
      type: python_logger_create
      message0: Logger %1 named %2
      args0:
      - type: field_input
        name: VAR_NAME
        text: logger
      - type: field_input
        name: LABEL
        text: app
      previousStatement: null
      nextStatement: null
      tooltip: Create a Logger instance. Place near the top of the workspace.
      helpUrl: https://docs.arduino.cc/software/app-lab/bridge/bridge-api/
    codegen:
      imports:
      - from arduino.app_utils import Logger
      declarations:
      - '{{VAR_NAME}} = Logger(''{{LABEL}}'')'
  - blockly:
      type: python_logger_log
      message0: '%1 . %2 %3'
      args0:
      - type: input_value
        name: LOGGER
      - type: field_dropdown
        name: LEVEL
        options:
        - - info
          - info
        - - debug
          - debug
        - - warning
          - warning
      - type: input_value
        name: MESSAGE
      previousStatement: null
      nextStatement: null
      tooltip: Log a message at the given level.
      inputsInline: true
    codegen:
      body:
      - '{{LOGGER}}.{{LEVEL}}({{MESSAGE}})'
      inputDefaults:
        LOGGER: logger
        MESSAGE: '""'
