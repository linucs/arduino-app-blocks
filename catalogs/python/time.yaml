# yaml-language-server: $schema=https://raw.githubusercontent.com/linucs/arduino-app-blocks/refs/heads/main/src/catalog/block-catalog_v1.schema.json
id: python_time
category: Control
implementations:
- runtime: arduino:python
  blocks:
  - blockly:
      type: python_wait
      message0: wait %1 ms
      args0:
      - type: input_value
        name: DURATION
        check: Number
      previousStatement: null
      nextStatement: null
      tooltip: Pause execution for the given number of milliseconds.
      inputsInline: true
    codegen:
      imports:
      - import time
      body:
      - time.sleep(({{DURATION}}) / 1000)
      inputDefaults:
        DURATION: '1000'
