id: brick-speech
category: "Audio"

implementations:
  - runtime: "arduino:python"
    dependencies:
      - type: brick
        name: "arduino:asr"
      - type: brick
        name: "arduino:tts"
    codegen:
      imports:
        - "from arduino.app_utils import ASR, TextToSpeech"
      declarations:
        - "_asr = ASR()"
        - "_tts = TextToSpeech()"
    blocks:
      - blockly:
          type: speech_on_transcript
          message0: "when speech detected"
          message1: "chunk in %1 do"
          args1:
            - type: field_variable
              name: TRANSCRIPT_VAR
              variable: transcript
          message2: "%1"
          args2:
            - type: input_statement
              name: DO
          nextStatement: null
          extensions:
            - hat_event_style
          tooltip: "Stream microphone audio to the speech recognition model. Run blocks for each transcription chunk."
        codegen:
          declarations:
            - "def _on_speech_chunk({{TRANSCRIPT_VAR}}):\n  {{DO}}"
          setup:
            - "with _asr.transcribe_stream() as _asr_stream:\n  for {{TRANSCRIPT_VAR}} in _asr_stream:\n    _on_speech_chunk({{TRANSCRIPT_VAR}})"
        tags: [event, speech, audio, beginner]

      - blockly:
          type: speech_speak
          message0: "speak %1"
          args0:
            - type: input_value
              name: TEXT
              check: String
          previousStatement: null
          nextStatement: null
          tooltip: "Synthesise and play the given text as speech."
          inputsInline: true
        codegen:
          body:
            - "_tts.speak({{TEXT}})"
          inputDefaults:
            TEXT: '""'
        tags: [actuator, speech, audio, beginner]

      - blockly:
          type: speech_cancel_asr
          message0: "cancel speech recognition"
          previousStatement: null
          nextStatement: null
          tooltip: "Stop the active speech recognition stream."
          inputsInline: true
        codegen:
          body:
            - "_asr.cancel()"
        tags: [actuator, speech, audio]

      - blockly:
          type: speech_cancel_tts
          message0: "cancel speech output"
          previousStatement: null
          nextStatement: null
          tooltip: "Stop the currently playing text-to-speech output."
          inputsInline: true
        codegen:
          body:
            - "_tts.cancel()"
        tags: [actuator, speech, audio]
